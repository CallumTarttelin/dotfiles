name: Check
on: [push, pull_request]

jobs:
  lint:
    runs-on: nix-native
    steps:
      - uses: actions/checkout@v4
      - name: Format (alejandra)
        run: nix run nixpkgs#alejandra -- --check .

  check:
    runs-on: nix-native
    steps:
      - uses: actions/checkout@v4
      - name: Flake check
        run: nix flake check

  build:
    runs-on: nix-native
    strategy:
      matrix:
        host: [nixshark, nixwork, nixie]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.host }}
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
