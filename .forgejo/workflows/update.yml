name: Flake Update
on:
  schedule:
    - cron: "0 2 * * *" # Daily at 2am
  workflow_dispatch:

jobs:
  update:
    runs-on: nix-native
    steps:
      - name: Check PAT secret
        env:
          FLAKE_UPDATER_TOKEN: ${{ secrets.FLAKE_UPDATER_TOKEN }}
        run: ': "${FLAKE_UPDATER_TOKEN:?Set the FLAKE_UPDATER_TOKEN Actions secret to a personal access token. Do not use FORGEJO_TOKEN; Forgejo reserves that for the automatic workflow token.}"'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FLAKE_UPDATER_TOKEN }}
      - name: Pre-update (pull custom package updates)
        run: nix run .#pre-update
      - name: Update flake.lock
        run: nix flake update
      - name: Format (alejandra)
        run: nix run nixpkgs#alejandra -- .
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$FORGEJO_OUTPUT"
          else
            echo "changed=true" >> "$FORGEJO_OUTPUT"
          fi
      - name: Create PR with auto-merge
        if: steps.changes.outputs.changed == 'true'
        env:
          FLAKE_UPDATER_TOKEN: ${{ secrets.FLAKE_UPDATER_TOKEN }}
          API: https://git.callumtarttelin.com/api/v1/repos/tarttelin/dotfiles
        run: |
          set -euo pipefail
          : "${FLAKE_UPDATER_TOKEN:?Set the FLAKE_UPDATER_TOKEN Actions secret to a personal access token. Do not use FORGEJO_TOKEN; Forgejo reserves that for the automatic workflow token.}"
          api() { curl -sSf -H "Authorization: token $FLAKE_UPDATER_TOKEN" -H "Content-Type: application/json" "$@"; }

          # Close any existing update PR
          existing=$(api "$API/pulls?state=open&head=tarttelin:auto/flake-update" | jq -r '.[0].number // empty')
          if [ -n "$existing" ]; then
            api -X PATCH "$API/pulls/$existing" -d '{"state":"closed"}'
            git push origin --delete auto/flake-update || true
          fi

          branch="auto/flake-update"
          git config user.name "Flake Updater"
          git config user.email "noreply@callumtarttelin.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: update flake.lock $(date +%Y-%m-%d)"
          git push -u origin "$branch" --force

          pr_number=$(api -X POST "$API/pulls" -d "{
            \"title\": \"chore: update flake.lock $(date +%Y-%m-%d)\",
            \"head\": \"$branch\",
            \"base\": \"main\",
            \"body\": \"Automated daily flake.lock update.\"
          }" | jq -r '.number')

          echo "Created PR #$pr_number"
